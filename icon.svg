<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123b88"/>
      <stop offset="50%" stop-color="#0a245c"/>
      <stop offset="100%" stop-color="#05153b"/>
    </linearGradient>
    
    <!-- Gold Rice Gradient -->
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Chicken Curry Gradient -->
    <linearGradient id="curryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Train Line Gradient -->
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square (The Icon Container) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)"/>

  <!-- SLEEK HIGH-SPEED TRAIN IN BACKGROUND -->
  <g opacity="0.45" transform="translate(0, -10)">
    <!-- Rail Tracks -->
    <path d="M 50 220 L 462 250 M 50 230 L 462 265 M 100 224 L 105 233 M 180 230 L 187 241 M 260 236 L 270 249 M 340 242 L 352 257 M 420 248 L 434 265" stroke="#fca5a5" stroke-width="2" stroke-opacity="0.5"/>
    
    <!-- Train Body -->
    <path d="M 60 180 Q 200 130 380 100 Q 420 95 440 120 Q 450 135 430 160 Q 300 200 60 215 Z" fill="none" stroke="url(#trainGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Windshield -->
    <path d="M 390 108 Q 420 105 432 118 Q 436 124 425 132 Q 400 125 390 108 Z" fill="#ffedd5" opacity="0.8"/>
    
    <!-- Windows -->
    <path d="M 100 178 L 140 174 L 140 166 L 100 170 Z 
             M 160 172 L 200 168 L 200 160 L 160 164 Z
             M 220 166 L 260 162 L 260 154 L 220 158 Z
             M 280 160 L 320 156 L 320 148 L 280 152 Z
             M 340 154 L 375 150 L 375 142 L 340 146 Z" fill="url(#trainGrad)"/>
    
    <!-- Speed Lines / Details -->
    <path d="M 60 195 Q 220 180 380 160" stroke="#fca5a5" stroke-width="2"/>
    <path d="M 60 150 Q 180 135 300 120" stroke="#fca5a5" stroke-width="1" stroke-dasharray="8,4"/>
  </g>

  <!-- STEAM CURLS RISING -->
  <g opacity="0.3" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 230 250 Q 210 200 240 150 T 220 90"/>
    <path d="M 260 245 Q 280 190 250 140 T 270 80"/>
    <path d="M 285 250 Q 310 205 290 160 T 310 100"/>
  </g>

  <!-- ORANGE/PEACH NAPKIN / TRAY UNDER THE PLATE -->
  <g filter="url(#shadow)">
    <!-- Trapezius shape napkin with custom corner jagged cuts -->
    <path d="M 90 350 L 422 350 L 392 375 L 120 375 Z" fill="#e27249"/>
    <!-- Jagged side teeth for authenticity -->
    <path d="M 90 350 L 95 354 L 100 350 L 105 354 L 110 350 M 422 350 L 417 354 L 412 350 L 407 354 L 402 350" stroke="#9a3412" stroke-width="2"/>
  </g>

  <!-- DELICIOUS BIRYANI PLATE -->
  <g filter="url(#shadow)">
    <!-- The Plate Rim -->
    <ellipse cx="256" cy="315" rx="145" ry="42" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <ellipse cx="256" cy="313" rx="138" ry="36" fill="#0f172a"/>

    <!-- The Rice Bed (Yellow & Gold Grains) -->
    <!-- Base shape for the rice mound -->
    <path d="M 125 315 Q 256 240 387 315 Q 350 345 256 345 Q 162 345 125 315 Z" fill="url(#riceGrad)"/>
    
    <!-- White Rice Grains Highlights -->
    <g fill="#ffffff" opacity="0.9">
      <!-- Detailed small rice shapes sprinkled -->
      <ellipse cx="160" cy="310" rx="6" ry="2" transform="rotate(15 160 310)"/>
      <ellipse cx="180" cy="295" rx="7" ry="2.5" transform="rotate(-25 180 295)"/>
      <ellipse cx="210" cy="320" rx="6" ry="2" transform="rotate(35 210 320)"/>
      <ellipse cx="240" cy="305" rx="7" ry="2.5" transform="rotate(-10 240 305)"/>
      <ellipse cx="270" cy="315" rx="6" ry="2" transform="rotate(45 270 315)"/>
      <ellipse cx="300" cy="298" rx="7" ry="2" transform="rotate(-30 300 298)"/>
      <ellipse cx="330" cy="310" rx="6" ry="2" transform="rotate(15 330 310)"/>
      <ellipse cx="350" cy="322" rx="5" ry="2" transform="rotate(-20 350 322)"/>
      <ellipse cx="145" cy="320" rx="5" ry="2" transform="rotate(40 145 320)"/>
      <ellipse cx="200" cy="312" rx="6" ry="2" transform="rotate(-5 200 312)"/>
      <ellipse cx="290" cy="310" rx="7" ry="2.3" transform="rotate(12 290 310)"/>
    </g>

    <!-- Warm Golden/Orange Rice Grains Highlights -->
    <g fill="#fef08a" opacity="0.95">
      <ellipse cx="150" cy="305" rx="6" ry="2" transform="rotate(-15 150 305)"/>
      <ellipse cx="170" cy="315" rx="6" ry="2" transform="rotate(30 170 315)"/>
      <ellipse cx="195" cy="290" rx="7" ry="2.5" transform="rotate(-40 195 290)"/>
      <ellipse cx="225" cy="310" rx="6" ry="2" transform="rotate(20 225 310)"/>
      <ellipse cx="255" cy="295" rx="7" ry="2.5" transform="rotate(-15 255 295)"/>
      <ellipse cx="285" cy="325" rx="6" ry="2" transform="rotate(50 285 325)"/>
      <ellipse cx="315" cy="305" rx="6" ry="2.3" transform="rotate(-25 315 305)"/>
      <ellipse cx="340" cy="315" rx="6" ry="2" transform="rotate(10 340 315)"/>
      <ellipse cx="365" cy="310" rx="5" ry="2" transform="rotate(-35 365 310)"/>
    </g>

    <!-- Chicken Pieces / Curry Masala toppings -->
    <path d="M 190 290 Q 210 260 230 285 Q 240 300 215 310 Q 185 305 190 290 Z" fill="url(#curryGrad)" stroke="#7c2d12" stroke-width="1.5"/>
    <path d="M 240 275 Q 265 245 285 270 Q 295 285 275 300 Q 245 295 240 275 Z" fill="url(#curryGrad)" stroke="#7c2d12" stroke-width="1.5"/>
    <path d="M 210 305 Q 235 285 255 305 Q 260 320 240 325 Q 210 320 210 305 Z" fill="url(#curryGrad)" stroke="#7c2d12" stroke-width="1.5"/>
    <path d="M 275 290 Q 295 270 315 290 Q 320 305 300 312 Q 275 310 275 290 Z" fill="url(#curryGrad)" stroke="#7c2d12" stroke-width="1.5"/>

    <!-- Glistening Highlights on Chicken pieces -->
    <path d="M 200 280 Q 208 273 212 281" stroke="#ffedd5" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 252 265 Q 262 258 266 266" stroke="#ffedd5" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 222 298 Q 230 292 234 300" stroke="#ffedd5" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Green Garnish (Coriander / Mint Leaves scattered) -->
    <g fill="#22c55e" stroke="#15803d" stroke-width="0.75">
      <!-- Mini leaves -->
      <path d="M 185 312 Q 188 305 192 312 Q 188 318 185 312 Z"/>
      <path d="M 225 280 Q 230 275 233 281 Q 230 286 225 280 Z" transform="rotate(30 225 280)"/>
      <path d="M 270 268 Q 275 262 278 268 Q 275 273 270 268 Z" transform="rotate(-40 270 268)"/>
      <path d="M 305 295 Q 310 290 313 296 Q 310 301 305 295 Z" transform="rotate(15 305 295)"/>
      <path d="M 245 315 Q 248 309 252 315 Q 248 320 245 315 Z" transform="rotate(-10 245 315)"/>
    </g>
  </g>

  <!-- BRAND NAME TEXT "Ramble" -->
  <text x="256" y="445" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="52" fill="#ff9f75" text-anchor="middle" letter-spacing="1">Ramble</text>
</svg>
